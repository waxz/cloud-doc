name = "cloud-doc"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# `wrangler deploy` and `wrangler dev` build the React app first, so a plain
# deploy (CLI, Git builds, Deploy to Cloudflare) needs no extra step.
[build]
command = "npm run build"
watch_dir = "client"

# The built app. The API and live sync run the Worker first; every other
# path falls back to the app.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/parties/*"]

# Migrations are bundled into the Worker, which applies pending ones itself
# on first use (see worker/migrate.ts).
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# One Durable Object per page holds the live Yjs document and its saved state.
[[durable_objects.bindings]]
name = "PageRoom"
class_name = "PageRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PageRoom"]

# Accounts, projects, pages, comments, share links and search. Created on the
# first deploy (no ID needed here).
[[d1_databases]]
binding = "DB"
database_name = "cloud-doc"
migrations_dir = "migrations"

[vars]
# PBKDF2 iterations for new passwords. 50,000 (~5 ms of CPU) fits the Free
# plan's 10 ms limit; on the paid plan raise it to 100,000 (the Workers maximum).
PASSWORD_ITERATIONS = "50000"

# Files and page history go to cloud-drive (optional). Connect it with one
# secret, the drive's WebDAV URL with a cloud-drive user in it:
#   npx wrangler secret put CLOUD_DRIVE_URL
#   https://user:password@cloud-drive.example.com/dav/drive
# Without it, everything else works and uploads and history are turned off.
#
# For a cloud-drive Worker on the same account, also add this binding (a
# Worker can't reach another Worker on the same account through its
# workers.dev URL); the URL then only supplies the user and drive path.
# [[services]]
# binding = "CLOUD_DRIVE"
# service = "cf-drive"
